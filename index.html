<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Rose Petals -->
    <div id="petals"></div>

    <!-- Welcome Card -->
    <div class="welcome-card">

        <h2>Together With Their Families</h2>

        <h1>Wedding Invitation</h1>

        <p class="welcome-text">
            We request the pleasure of your gracious presence
            to celebrate our wedding ceremony.
        </p>

        <button onclick="openInvitation()">
            🌹 Open Invitation 🌹
        </button>

    </div>

<script src="script.js"></script>

</body>
</html>
